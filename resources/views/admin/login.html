<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - UMKM Culinary’s NTT</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 56px; height: 56px; background: var(--primary); border-radius: 16px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: white;">
          🍽️
        </div>
        <h1 style="font-family: var(--font-heading); font-size: 22px; font-weight: 800; color: white;">
          UMKM Culinary’s NTT
        </h1>
        <p style="font-size: 12px; color: #fb923c; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px;">
          Admin Portal
        </p>
      </div>

      <div id="error-message" style="display: none; background: #450a0a; border: 1px solid #991b1b; color: #fca5a5; padding: 10px 14px; border-radius: 10px; font-size: 12px; margin-bottom: 16px;"></div>

      <form id="admin-login-form">
        <div class="form-group">
          <label style="color: #a8a29e;">Email</label>
          <input type="email" id="email" class="form-control" placeholder="admin@warung.com" value="admin@warung.com" required style="background: #0c0a09; color: white; border-color: #292524;">
        </div>

        <div class="form-group">
          <label style="color: #a8a29e;">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" value="password123" required style="background: #0c0a09; color: white; border-color: #292524;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; margin-top: 8px;">
          Login Admin →
        </button>
      </form>
  <script src="js/login.js"></script>
</body>
</html>
