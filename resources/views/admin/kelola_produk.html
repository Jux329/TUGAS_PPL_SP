<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Produk - Admin UMKM Culinary's NTT</title>
  <link rel="stylesheet" href="css/kelola_produk.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <div id="admin-sidebar-container"></div>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="page-header">
        <div>
          <h1 class="page-title">Kelola Produk</h1>
          <p class="page-desc">Tambah, edit, dan kelola menu produk kuliner khas NTT</p>
        </div>
        <button onclick="openProductModal()" class="btn btn-primary">+ Tambah Produk Baru</button>
      </div>

      <!-- Filter -->
      <div class="card-box" style="margin-bottom: 24px;">
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <input type="text" id="search-product" class="form-control" placeholder="Cari produk..." style="flex: 1; min-width: 200px;">
          <select id="category-filter" class="form-control" style="min-width: 150px;">
            <option value="">Semua Kategori</option>
          </select>
          <select id="status-filter-product" class="form-control" style="min-width: 150px;">
            <option value="">Semua Status</option>
            <option value="Aktif">Aktif</option>
            <option value="Tidak Aktif">Tidak Aktif</option>
          </select>
        </div>
      </div>

      <!-- Products Grid -->
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;">
        <div id="products-container">
          <!-- Populated by script -->
        </div>
      </div>
    </main>
  </div>

  <!-- Product Modal -->
  <div id="product-modal" class="modal-overlay">
    <div class="card-box" style="max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f5f5f4; padding-bottom: 12px;">
        <h2 style="font-size: 18px; font-weight: 800;" id="modal-title">Tambah Produk Baru</h2>
        <button onclick="closeProductModal()" style="background: none; border: none; font-size: 20px; cursor: pointer;">×</button>
      </div>

      <form id="product-form" style="display: flex; flex-direction: column; gap: 12px;">
        <div class="form-group">
          <label>Nama Produk *</label>
          <input type="text" id="prod-name" class="form-control" placeholder="Contoh: Se'i Sapi Sambal Lu'at" required>
        </div>

        <div class="product-form-grid">
          <div class="form-group">
            <label>Kategori *</label>
            <select id="prod-category" class="form-control" required>
              <option value="">-- Pilih Kategori --</option>
            </select>
          </div>

          <div class="form-group">
            <label>Harga *</label>
            <input type="number" id="prod-price" class="form-control" placeholder="45000" min="0" required>
          </div>
        </div>

        <div class="product-form-grid">
          <div class="form-group">
            <label>Stok *</label>
            <input type="number" id="prod-stock" class="form-control" placeholder="25" min="0" required>
          </div>

          <div class="form-group">
            <label>Status *</label>
            <select id="prod-status" class="form-control" required>
              <option value="Aktif">Aktif</option>
              <option value="Tidak Aktif">Tidak Aktif</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Deskripsi Produk</label>
          <textarea id="prod-desc" class="form-control" rows="3" placeholder="Jelaskan detail produk..."></textarea>
        </div>

        <div class="form-group">
          <label>URL Gambar</label>
          <input type="url" id="prod-image" class="form-control" placeholder="https://images.unsplash.com/...">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #f5f5f4;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Simpan Produk</button>
          <button type="button" onclick="closeProductModal()" class="btn btn-secondary" style="flex: 1;">Batal</button>
        </div>
      </form>
    </div>
  </div>
  <script src="js/kelola_produk.js"></script>
</body>
</html>
