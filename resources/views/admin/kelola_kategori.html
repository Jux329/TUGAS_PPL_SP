<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Kategori - Admin UMKM Culinary’s NTT</title>
  <link rel="stylesheet" href="css/kelola_kategori.css">
</head>
<body>
  <div class="admin-layout">
    <div id="admin-sidebar-container"></div>

    <main class="admin-main">
      <div class="page-header">
        <div>
          <h1 class="page-title">Kelola Kategori</h1>
          <p class="page-desc">Pengelompokan menu makanan, minuman, cemilan, dan paket kuliner khas</p>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px;">
        <!-- Form Tambah Kategori -->
        <div class="card-box">
          <h2 style="font-size: 16px; font-weight: 800; color: #0c0a09; margin-bottom: 16px; border-bottom: 1px solid #f5f5f4; padding-bottom: 8px;">
            + Tambah Kategori Baru
          </h2>

          <form id="add-category-form" onsubmit="handleAddCategory(event)">
            <div class="form-group">
              <label>Nama Kategori *</label>
              <input type="text" id="cat-name-input" class="form-control" placeholder="Contoh: Sambal Khas" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
              Tambah Kategori
            </button>
          </form>
        </div>

        <!-- Daftar Kategori Table -->
        <div class="card-box">
          <h2 style="font-size: 16px; font-weight: 800; color: #0c0a09; margin-bottom: 16px; border-bottom: 1px solid #f5f5f4; padding-bottom: 8px; display: flex; justify-content: space-between;">
            <span>Daftar Kategori</span>
            <span id="total-cat-count" style="font-size: 12px; color: #78716c;">Total: 0</span>
          </h2>

          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Nama Kategori</th>
                  <th style="text-align: center;">Jumlah Menu</th>
                  <th style="text-align: right;">Aksi</th>
                </tr>
              </thead>
              <tbody id="category-table-body">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/kelola_kategori.js"></script>
</body>
</html>
