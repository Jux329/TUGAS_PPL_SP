<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Masuk Akun - UMKM Culinary's NTT</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap');

    :root {
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --primary-light: #fff7ed;
      --primary-border: #fed7aa;
      --bg-page: #fafaf9;
      --text-main: #1c1917;
      --text-muted: #78716c;
      --border-color: #e7e5e4;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Playfair Display', serif;
      --radius-md: 14px;
      --radius-xl: 28px;
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--font-body);
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================= HEADER ================= */

    .header-navbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo-icon {
      width: 38px;
      height: 38px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }

    .brand-name {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 800;
      color: #0c0a09;
      line-height: 1.1;
    }

    .brand-tag {
      font-size: 10px;
      color: var(--primary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-links-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-item {
      font-size: 13.5px;
      font-weight: 700;
      color: #57534e;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      transition: all 0.2s;
    }

    .nav-item:hover,
    .nav-item.active {
      background: #f5f5f4;
      color: var(--primary);
    }

    /* ================= MAIN ================= */

    .main-wrapper {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    .auth-wrapper {
      min-height: calc(100vh - 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: var(--shadow-md);
    }

    .auth-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-title h1 {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      color: #0c0a09;
    }

    .auth-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    /* ================= FORM ================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #44403c;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 14px;
      outline: none;
      background: #ffffff;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* ================= ALERT ================= */

    .error-alert {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* ================= BOTTOM AUTH ================= */

    .auth-bottom {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .auth-bottom a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .auth-bottom a:hover {
      text-decoration: underline;
    }

    .demo-account {
      margin-top: 16px;
      padding: 10px;
      background: #f5f5f4;
      border-radius: 10px;
      font-size: 12px;
      text-align: left;
      line-height: 1.7;
    }

    .demo-account code {
      color: #ea580c;
      font-weight: 700;
    }

    /* ================= FOOTER ================= */

    .footer-wrap {
      background: #1c1917;
      color: #a8a29e;
      padding: 32px 20px;
      font-size: 13px;
      margin-top: auto;
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 640px) {
      .header-container {
        flex-direction: column;
        gap: 12px;
      }

      .nav-links-wrap {
        width: 100%;
        justify-content: center;
      }

      .auth-wrapper {
        padding: 10px;
      }

      .auth-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="header-navbar">
    <div class="header-container">

      <a href="menu.html" class="brand-link">
        <div class="brand-logo-icon">🍴</div>

        <div>
          <div class="brand-name">
            UMKM Culinary's NTT
          </div>

          <div class="brand-tag">
            Kuliner Khas NTT
          </div>
        </div>
      </a>
    </div>
  </header>
  <!-- ================= MAIN ================= -->

  <main class="main-wrapper">

    <div class="auth-wrapper">

      <div class="auth-card">

        <div class="auth-title">
          <h1>Masuk Akun Pelanggan</h1>

          <p>
            Silakan masuk untuk memesan kuliner khas NTT favorit Anda
          </p>
        </div>


        <div id="error-alert" class="error-alert"></div>


        <form id="customer-login-form">

          <div class="form-group">

            <label for="username">
              Username
            </label>

            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Masukkan username"
              autocomplete="username"
              required
            >

          </div>


          <div class="form-group">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Masukan password"
              autocomplete="current-password"
              required
            >
          </div>
          <button
            type="submit"
            class="btn btn-primary"
          >
            Masuk
          </button>

        </form>


        <div class="auth-bottom">

          Belum punya akun?
          <a href="register.html">
            Daftar di sini
          </a>

          </div>

        </div>

      </div>

    </div>

  </main>

  <!-- ================= FOOTER ================= -->

  <footer class="footer-wrap">

    <div class="footer-container">

      <div>
        © 2026 UMKM Culinary's NTT
      </div>

      <div>
        Kuliner Khas NTT
      </div>

    </div>

  </footer>

  <!-- ================= JAVASCRIPT ================= -->

  <script>
    const form = document.getElementById("customer-login-form");
    const errorAlert = document.getElementById("error-alert");
    function showError(message) {
      errorAlert.textContent = message;
      errorAlert.style.display = "block";
    }
    function hideError() {
      errorAlert.textContent = "";
      errorAlert.style.display = "none";
    }
    function getCustomerAccounts() {
      const accounts =
        localStorage.getItem("ntt_customer_accounts");
      if (!accounts) {
        return [];
      }
      try {
        return JSON.parse(accounts);
      } catch (error) {
        return [];
      }
    }
    function createDemoAccount() {
      const accounts = getCustomerAccounts();
      const demoExists = accounts.some(
        account => account.username === "zaynn"
      );

      if (!demoExists) {

        accounts.push({
          username: "zaynn",
          password: "zaynn123"
        });

        localStorage.setItem(
          "ntt_customer_accounts",
          JSON.stringify(accounts)
        );

      }

    }


    /*
      Proses login
    */
    form.addEventListener("submit", function(event) {

      event.preventDefault();

      hideError();


      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;


      if (!username || !password) {

        showError(
          "Username dan password wajib diisi."
        );

        return;

      }


      const accounts = getCustomerAccounts();


      const account = accounts.find(function(item) {

        return (
          item.username.toLowerCase() === username.toLowerCase() &&
          item.password === password
        );

      });


      if (!account) {

        showError(
          "Username atau password yang Anda masukkan salah."
        );

        return;

      }


      /*
        Menyimpan customer yang sedang login.
      */
      localStorage.setItem(
        "ntt_current_customer",
        JSON.stringify({
          username: account.username
        })
      );


      /*
        Login berhasil → halaman menu
      */
      window.location.href = "menu.html";

    });


    /*
      Pastikan akun demo tersedia.
    */
    createDemoAccount();

  </script>

</body>
</html>
