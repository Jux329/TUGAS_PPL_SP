<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daftar Akun Baru - UMKM Culinary's NTT</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap');

    :root {
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --bg-page: #fafaf9;
      --text-main: #1c1917;
      --text-muted: #78716c;
      --border-color: #e7e5e4;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Playfair Display', serif;
      --radius-md: 14px;
      --radius-xl: 28px;
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--font-body);
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================= HEADER ================= */

    .header-navbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo-icon {
      width: 38px;
      height: 38px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }

    .brand-name {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 800;
      color: #0c0a09;
      line-height: 1.1;
    }

    .brand-tag {
      font-size: 10px;
      color: var(--primary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-links-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-item {
      font-size: 13.5px;
      font-weight: 700;
      color: #57534e;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      transition: all 0.2s;
    }

    .nav-item:hover,
    .nav-item.active {
      background: #f5f5f4;
      color: var(--primary);
    }

    /* ================= MAIN ================= */

    .main-wrapper {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    .auth-wrapper {
      min-height: calc(100vh - 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: var(--shadow-md);
    }

    .auth-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-title h1 {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      color: #0c0a09;
    }

    .auth-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    /* ================= FORM ================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #44403c;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 14px;
      outline: none;
      background: #ffffff;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* ================= ALERT ================= */

    .error-alert {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .success-alert {
      display: none;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* ================= BOTTOM AUTH ================= */

    .auth-bottom {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .auth-bottom a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .auth-bottom a:hover {
      text-decoration: underline;
    }

    /* ================= FOOTER ================= */

    .footer-wrap {
      background: #1c1917;
      color: #a8a29e;
      padding: 32px 20px;
      font-size: 13px;
      margin-top: auto;
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 640px) {

      .header-container {
        flex-direction: column;
        gap: 12px;
      }

      .nav-links-wrap {
        width: 100%;
        justify-content: center;
      }

      .auth-wrapper {
        padding: 10px;
      }

      .auth-card {
        padding: 28px 22px;
      }

    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="header-navbar">

    <div class="header-container">

      <a href="menu.html" class="brand-link">

        <div class="brand-logo-icon">
          🍴
        </div>

        <div>

          <div class="brand-name">
            UMKM Culinary's NTT
          </div>

          <div class="brand-tag">
            Kuliner Khas NTT
          </div>

        </div>

      </a>

  </header>


  <!-- ================= MAIN ================= -->

  <main class="main-wrapper">

    <div class="auth-wrapper">

      <div class="auth-card">

        <div class="auth-title">

          <h1>
            Daftar Akun Baru
          </h1>

          <p>
            Bergabunglah untuk menikmati berbagai hidangan khas NTT terbaik
          </p>

        </div>


        <div id="error-alert" class="error-alert"></div>

        <div id="success-alert" class="success-alert"></div>


        <form id="customer-register-form">

          <div class="form-group">

            <label for="reg-username">
              Username
            </label>

            <input
              type="text"
              id="reg-username"
              class="form-control"
              placeholder="Pilih username unik Anda"
              autocomplete="username"
              minlength="3"
              required
            >

          </div>


          <div class="form-group">

            <label for="reg-password">
              Password
            </label>

            <input
              type="password"
              id="reg-password"
              class="form-control"
              placeholder="Minimal 6 karakter"
              autocomplete="new-password"
              minlength="6"
              required
            >

          </div>


          <button
            type="submit"
            class="btn btn-primary"
          >
            Daftar
          </button>

        </form>


        <div class="auth-bottom">

          Sudah punya akun?

          <a href="login.html">
            Masuk di sini
          </a>

        </div>

      </div>

    </div>

  </main>


  <!-- ================= FOOTER ================= -->

  <footer class="footer-wrap">

    <div class="footer-container">

      <div>
        © 2026 UMKM Culinary's NTT
      </div>

      <div>
        Kuliner Khas NTT
      </div>

    </div>

  </footer>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    const form =
      document.getElementById("customer-register-form");

    const errorAlert =
      document.getElementById("error-alert");

    const successAlert =
      document.getElementById("success-alert");


    /*
      Mengambil akun customer dari localStorage.
    */
    function getCustomerAccounts() {

      const accounts =
        localStorage.getItem("ntt_customer_accounts");

      if (!accounts) {
        return [];
      }

      try {

        return JSON.parse(accounts);

      } catch (error) {

        return [];

      }

    }


    /*
      Menampilkan error.
    */
    function showError(message) {

      errorAlert.textContent = message;
      errorAlert.style.display = "block";

      successAlert.style.display = "none";

    }


    /*
      Menampilkan pesan berhasil.
    */
    function showSuccess(message) {

      successAlert.textContent = message;
      successAlert.style.display = "block";

      errorAlert.style.display = "none";

    }


    /*
      Proses registrasi.
    */
    form.addEventListener("submit", function(event) {

      event.preventDefault();


      const username =
        document.getElementById("reg-username")
          .value
          .trim();

      const password =
        document.getElementById("reg-password")
          .value;


      /*
        Validasi username.
      */
      if (username.length < 3) {

        showError(
          "Username minimal terdiri dari 3 karakter."
        );

        return;

      }


      /*
        Validasi password.
      */
      if (password.length < 6) {

        showError(
          "Password minimal terdiri dari 6 karakter."
        );

        return;

      }


      /*
        Ambil akun yang sudah ada.
      */
      const accounts = getCustomerAccounts();


      /*
        Cek apakah username sudah digunakan.
      */
      const usernameExists = accounts.some(function(account) {

        return (
          account.username.toLowerCase() ===
          username.toLowerCase()
        );

      });


      if (usernameExists) {

        showError(
          "Username sudah digunakan. Silakan pilih username lain."
        );

        return;

      }


      /*
        Tambahkan akun baru.
      */
      accounts.push({
        username: username,
        password: password
      });


      /*
        Simpan akun.
      */
      localStorage.setItem(
        "ntt_customer_accounts",
        JSON.stringify(accounts)
      );


      /*
        Tampilkan pesan berhasil.
      */
      showSuccess(
        "Akun berhasil dibuat. Anda akan diarahkan ke halaman login."
      );


      /*
        Bersihkan form.
      */
      form.reset();


      /*
        Arahkan ke login setelah 1,5 detik.
      */
      setTimeout(function() {

        window.location.href = "login.html";

      }, 1500);

    });

  </script>

</body>
</html>
